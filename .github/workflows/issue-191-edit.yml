name: Issue 191 isolated source audit
on:
  push:
    branches: [work/191-complete-cleanup]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'kuasar-sandbox/sandboxer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6bbbfc9f5c55bad957f583bc81d1951f78e79926
          fetch-depth: 0
          persist-credentials: false
      - name: Archive the exact candidate and inspect size-key fixtures
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6bbbfc9f5c55bad957f583bc81d1951f78e79926
          git archive --format=tar HEAD > "$RUNNER_TEMP/issue-191-candidate.tar"
          git diff 76dba47d54c5d670ab29669d25e9e0f977a30030...HEAD > "$RUNNER_TEMP/issue-191.diff"
          git grep -n -E '(^|[^[:alnum:]_])(diff_size|size)[[:space:]]*:' -- '*.go' '*.sh' '*.yaml' '*.yml' '*.md' || test "$?" = 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-191-exact-source
          path: |
            ${{ runner.temp }}/issue-191-candidate.tar
            ${{ runner.temp }}/issue-191.diff
          if-no-files-found: error
          retention-days: 1
