name: issue-151-validation

on:
  push:
    branches:
      - perf/issue-151-location-no-reread

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Create repository read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: sandboxer,accelerator,connector
          permission-contents: read

      - name: Checkout sandboxer
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: sandboxer

      - name: Checkout accelerator
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: kuasar-sandbox/accelerator
          path: accelerator

      - name: Checkout connector
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: kuasar-sandbox/connector
          path: connector

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sandboxer/go.mod
          cache-dependency-path: |
            sandboxer/go.sum
            accelerator/go.sum
            connector/go.sum

      - name: Check formatting
        working-directory: sandboxer
        run: test -z "$(gofmt -l pkg/artifact/location_target.go pkg/artifact/location_target_no_reread_test.go)"

      - name: Test artifact package
        working-directory: sandboxer
        run: go test ./pkg/artifact

      - name: Test repository
        working-directory: sandboxer
        run: go test ./...
