name: Issue 191 isolated fixture completion
on:
  push:
    branches: [work/191-complete-cleanup]
permissions:
  contents: write
jobs:
  edit:
    if: github.repository == 'kuasar-sandbox/sandboxer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/191-remove-ineffective-disk-size
          fetch-depth: 0
      - name: Apply the bounded fixture completion
        env:
          HELPER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6bbbfc9f5c55bad957f583bc81d1951f78e79926
          git show "$HELPER_SHA:.github/issue-191-complete.py" > "$RUNNER_TEMP/issue-191-complete.py"
          python3 "$RUNNER_TEMP/issue-191-complete.py"
          git diff > "$RUNNER_TEMP/completion.diff"
          test "$(sha256sum "$RUNNER_TEMP/completion.diff" | cut -d' ' -f1)" = 8d4c1cd29171ec4c796a11c2387804027d048ac2460ebcb41c1ffd7d283eaca6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pkg/config/disk_size_test.go pkg/sandbox/helpers_test.go test/e2e
          git commit -m 'test: complete disk-size fixture migration and block-style coverage'
          git push origin HEAD:refs/heads/fix/191-remove-ineffective-disk-size
          git rev-parse HEAD
