name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Component version in vX.Y.Z or vX.Y.Z-preview.YYYYMMDD form
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: component-release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET_ARCH: x86_64
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "Release must run from main" >&2; exit 1; }
          bash scripts/publish-release.sh check "$VERSION" "$TARGET_ARCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kuasar-e2e
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET_ARCH: x86_64
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.google.cn
      GOTOOLCHAIN: local
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Create read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KUASAR_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KUASAR_CI_APP_PRIVATE_KEY }}
          owner: kuasar-sandbox
          repositories: accelerator,connector,sandboxer
          permission-contents: read
          skip-token-revoke: true

      - name: Check out exact sandboxer source
        id: checkout-sandboxer
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/sandboxer
          ref: ${{ github.sha }}
          path: src/sandboxer
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry exact sandboxer source checkout
        if: steps.checkout-sandboxer.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/sandboxer
          ref: ${{ github.sha }}
          path: src/sandboxer
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Check out accelerator dependency
        id: checkout-accelerator
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/accelerator
          ref: main
          path: src/accelerator
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry accelerator dependency checkout
        if: steps.checkout-accelerator.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/accelerator
          ref: main
          path: src/accelerator
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Check out connector dependency
        id: checkout-connector
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/connector
          ref: main
          path: src/connector
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Retry connector dependency checkout
        if: steps.checkout-connector.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kuasar-sandbox/connector
          ref: main
          path: src/connector
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false

      - name: Revoke source token before code execution
        if: ${{ always() && steps.source-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          status=$(curl --show-error --silent \
            --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --request DELETE \
            --output /dev/null \
            --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/installation/token)
          case "$status" in
            204|401) ;;
            *) echo "failed to revoke source token: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Assemble source workspace
        run: |
          set -euo pipefail
          rm -f go.work go.work.sum
          go work init ./src/accelerator ./src/connector ./src/sandboxer
          install -d -m 0755 /var/cache/kuasar/tarballs
          mkdir -p src/sandboxer/native-deps/build
          ln -sfn /var/cache/kuasar/tarballs src/sandboxer/native-deps/build/tarball

      - name: Build and test sandboxer
        working-directory: src/sandboxer
        run: |
          set -euo pipefail
          make test
          make vet
          make build

      - name: Package the component release
        working-directory: src/sandboxer
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          bash scripts/release.sh package "$VERSION" "$TARGET_ARCH" release-bundle

      - name: Upload validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: src/sandboxer/release-bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    concurrency:
      group: component-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted publish tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: component-release-${{ needs.preflight.outputs.version }}-${{ github.run_id }}
          path: release-bundle

      - name: Publish component release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET_ARCH: x86_64
        run: |
          set -euo pipefail
          bash scripts/publish-release.sh publish \
            "$VERSION" "$TARGET_ARCH" "$GITHUB_SHA" release-bundle
