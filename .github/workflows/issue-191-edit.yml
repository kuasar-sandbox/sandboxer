name: Issue 191 isolated edit verification
on:
  push:
    branches: [work/191-complete-cleanup]
permissions:
  contents: write
jobs:
  edit:
    if: github.repository == 'kuasar-sandbox/sandboxer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/191-remove-ineffective-disk-size
          fetch-depth: 0
      - name: Apply bounded edits and verify formatting
        env:
          HELPER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git show "$HELPER_SHA:.github/issue-191-edit.py" > "$RUNNER_TEMP/issue-191-edit.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'issue-191-edit.py'
          s = p.read_text()
          needle = "    assert 'DiffSizeBytes' not in s"
          assert s.count(needle) == 1
          replacement = '''    if path == 'pkg/config/config_test.go':
                  s = replace(s, '\\tcfg.Boot.Root.Overlay.DiffSize = ""\\n', '')
                  s = replace(s, '      diff: file:///run/sb/diff.ext4\\n      size: 1GiB\\n', '      diff: file:///run/sb/diff.ext4\\n')
              assert 'DiffSizeBytes' not in s'''
          s = s.replace(needle, replacement)
          p.write_text(s)
          PY
          python3 "$RUNNER_TEMP/issue-191-edit.py"
