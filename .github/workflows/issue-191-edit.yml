name: Issue 191 isolated edit verification
on:
  push:
    branches: [work/191-complete-cleanup]
permissions:
  contents: write
jobs:
  edit:
    if: github.repository == 'kuasar-sandbox/sandboxer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/191-remove-ineffective-disk-size
          fetch-depth: 0
      - name: Remove remaining retired size examples
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ffaf3bbde44dc593c91479ffa0206ac022c8645a
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          paths = {
              'pkg/resctl/helpers_test.go': 1,
              'test/e2e/e2e_sandbox_local_merge.sh': 2,
              'test/e2e/e2e_sandbox_memory_budget_workingset.sh': 2,
              'test/e2e/e2e_sandbox_restore_files.sh': 3,
              'test/e2e/e2e_sandbox_tapfd.sh': 2,
          }
          for name, count in paths.items():
              p = Path(name)
              s = p.read_text()
              actual = sum(len(re.findall(r',\s*size:\s*[A-Za-z0-9.]+', line)) for line in s.splitlines() if 'overlay:' in line)
              assert actual == count, (name, actual, count)
              p.write_text('\n'.join(re.sub(r',\s*size:\s*[A-Za-z0-9.]+', '', line) if 'overlay:' in line else line for line in s.split('\n')))
              if name.endswith('.sh'):
                  subprocess.check_call(['bash', '-n', name])
          subprocess.check_call(['gofmt', '-w', 'pkg/resctl/helpers_test.go'])
          subprocess.check_call(['git', 'diff', '--check'])
          r = subprocess.run(['git', 'grep', '-n', '-E', r'overlay:.*\bsize:|\bDiffSize\b|DiffSizeBytes', '--', '*.go', '*.sh', '*.yaml', '*.yml'], text=True, capture_output=True)
          unexpected = [line for line in r.stdout.splitlines() if 'pkg/config/disk_size_test.go:' not in line]
          assert r.returncode in (0, 1) and not unexpected, unexpected or r.stderr
          subprocess.check_call(['git', 'diff', '--stat'])
          subprocess.check_call(['git', 'add', '--', *paths])
          subprocess.check_call(['git', 'commit', '-m', 'test: remove remaining obsolete overlay size inputs'])
          subprocess.check_call(['git', 'push', 'origin', 'HEAD:refs/heads/fix/191-remove-ineffective-disk-size'])
          PY
