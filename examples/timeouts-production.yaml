# timeouts-production.yaml — example host-side deadline profile for
# production management operations. Validate these values for your workload.
# Merge this fragment into your sandbox.yaml, e.g.
#
#   sandbox-ctl run --config base.yaml:examples/timeouts-production.yaml ...
#
# Rationale: the default (an absent `timeouts:` block, or empty fields) imposes
# NO FORCED TIMEOUT on the restore/lifecycle path — the host waits as long as
# the guest, cloud-hypervisor, or lazy page-in needs, while dial/connect probes
# stay bounded. That default is for development / debugging / degraded
# environments, where a stalled remote-store or cache (or a paused debugger)
# should NOT abort a restore that is still making healthy progress.
#
# These are example management deadlines, not an end-to-end recovery SLO.
# Tune against measured cold/resume latency and your failure policy. A failed
# restore does not itself prove that another node is eligible to restore it.
#
# NOTE: these bound only the host-side management/handshake path. The lazy-load
# FETCH path (uffd page faults, vhost block reads) uses source read recovery.
# `cache.timeout` / `store.timeout` bound one backend attempt, NOT total retry
# duration. Retryable reads retain their request/buffer until success, operation
# cancellation or a permanent error; independent fatal health policy can end
# the runtime. There is no cumulative read-retry deadline or attempt limit.
# See docs/sandbox.md#read-recovery for diagnosis and shutdown boundaries.
# The `snapshot` subcommand has its own `--timeout`.

timeouts:
  # Host wait for the guest's restore_ack after /vm.resume. Must exceed the
  # worst-case "resume + fault in the working set" time for your images.
  restore: 60s

  # cloud-hypervisor HTTP API single-response deadline (e.g. /vm.resume). The
  # dial stays bounded (5s) regardless; this bounds a slow RESPONSE.
  ch_api: 60s

  # Poll wait for the CH API socket to start accepting after CH is spawned.
  api_ready: 30s

  # CH→host uffd-fd handoff handshake (va_report). CH issues this early in
  # boot/restore; a small bound is fine.
  va_report: 15s

  # Host→guest ping round-trip. 200ms is the tight liveness probe. IMPORTANT:
  # if you also set --ping-fatal-threshold, this MUST be bounded (as here) —
  # the default (unset) is no-forced, under which a wedged-but-connected guest
  # would never trip the fatal threshold (the ping waits instead of failing).
  ping: 200ms

  # Host read of one guest→host launch-port message (hello / app_started /
  # app_exited / mem_report). 200ms is tight; raise it if your guests send
  # mem_report while a slow page-in still blocks the vCPU.
  app_notify: 200ms
